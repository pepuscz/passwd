name: Publish to npm

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: node --test packages/*/dist/__tests__/*.test.js

      # Skip a package only when npm already has this exact version. Any
      # other failure (auth, provenance, E403) fails the job.
      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in passwd-lib passwd-mcp passwd-cli passwd-agent-cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            published=$(npm view "$name@$version" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "$name@$version is already on npm, skipping"
              continue
            fi
            npm publish --workspace "packages/$pkg" --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-mcpb:
    runs-on: macos-latest
    needs: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Build .mcpb
        run: bash packages/passwd-mcpb/build.sh

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passwd.mcpb
          path: packages/passwd-mcpb/passwd.mcpb

  release-mcpb:
    runs-on: ubuntu-latest
    needs: build-mcpb
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download .mcpb artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: passwd.mcpb

      # gh is preinstalled on the runner, so no third-party action needs
      # contents: write.
      - name: Attach .mcpb to release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" passwd.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
